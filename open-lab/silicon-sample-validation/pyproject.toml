[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "silicon-sample-validation"
version = "0.1.0"
description = "Open, pre-registration-friendly harness for validating LLM silicon samples against official surveys."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Giovanni Oliveira" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]
keywords = ["llm", "silicon samples", "validation", "pre-registration", "survey methodology"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
anthropic = ["anthropic"]
test = ["pytest>=7"]

[project.scripts]
ssv = "silicon_sample_validation.cli:main"

[project.urls]
Homepage = "https://github.com/Neckr0ik"

[tool.hatch.build.targets.wheel]
packages = ["src/silicon_sample_validation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
