# Firecrawl MCP (HTTP) + Caddy (ruta secreta) + Tailscale Funnel.
# Mismo patrón que ../graphiti-mcp. Necesita Firecrawl corriendo en el host (puerto 3002).
# Nada se expone a la red local salvo 127.0.0.1; la salida pública es solo por Funnel.
services:
  firecrawl-mcp:
    build: .
    restart: unless-stopped
    environment:
      - HTTP_STREAMABLE_SERVER=true
      - HOST=0.0.0.0
      - PORT=3000
      # API de Firecrawl self-hosted por su red interna (sin auth: la key es de relleno).
      - FIRECRAWL_API_URL=${FIRECRAWL_API_URL:-http://api:3002}
      - FIRECRAWL_API_KEY=dummy
    networks: [default, firecrawl]
    ports:
      - "127.0.0.1:3010:3000"  # MCP para uso local: http://127.0.0.1:3010/mcp

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [firecrawl-mcp]

  tailscale:
    image: tailscale/tailscale:v1.104.4
    hostname: ${TS_HOSTNAME:-firecrawl}
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=${TS_HOSTNAME:-firecrawl}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on: [caddy]

networks:
  # Red que crea el compose de Firecrawl (proyecto "firecrawl", red "backend").
  # Firecrawl tiene que estar levantado antes; el script de instalación se encarga.
  firecrawl:
    external: true
    name: ${FIRECRAWL_NETWORK:-firecrawl_backend}

volumes:
  tailscale_state:
