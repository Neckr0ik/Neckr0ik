[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "llm-survey-bias-kit"
version = "0.1.0"
description = "Diagnostics for LLM-simulated survey and message-test responses: answer-order bias, paired A/B with replicates, A/A noise floor, homogeneity, Kish effective n."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Giovanni Oliveira" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]
keywords = ["llm", "silicon samples", "survey methodology", "position bias", "a/b testing"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
scipy = ["scipy>=1.10"]
test = ["pytest>=7"]

[project.scripts]
llm-bias-kit = "llm_survey_bias_kit.cli:main"

[project.urls]
Homepage = "https://github.com/Neckr0ik"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_survey_bias_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
